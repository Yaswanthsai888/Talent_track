global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'

  - job_name: 'code-evaluator'
    static_configs:
      - targets: ['code-evaluator:5002']
    metrics_path: '/metrics'

  - job_name: 'test-metrics'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/api/analytics/metrics'
